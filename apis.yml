name: Free Agency
description: Free Agency is a careers company and talent marketplace that pairs technology
  professionals with an AI-powered Talent Agent which proactively surfaces relevant work
  — full-time roles and short project engagements with defined deliverables, duration, and
  compensation. Founded by Sherveen Mashayekhi and backed by Bloomberg Beta, the company has
  raised a $10M Series A and counts talent placed at companies such as OpenAI, Stripe, and
  Figma. It also publishes Intent, a newsletter for careerists, and runs CareerMakers, a
  cohort course hosted on Maven. As of August 2026 the entire public surface is a single
  waitlist landing page with two Tally intake forms — one for individual talent and one
  "For AI companies" — plus the Intent newsletter and an Ashby-hosted job board. Free
  Agency exposes no public API, SDK, developer portal, or machine-readable contract of
  any kind; this profile tracks it in the API Evangelist network as a company stub with
  a probed, verified absence rather than an unexamined gap.
