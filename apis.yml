description: Free Agency is a careers company and talent marketplace that pairs technology
  professionals with an AI-powered Talent Agent which proactively surfaces relevant work
  — full-time roles and short project engagements with defined deliverables, duration, and
  compensation. Founded by Sherveen Mashayekhi and backed by Bloomberg Beta, the company has
  raised a $10M Series A and counts talent placed at companies such as OpenAI, Stripe, and
  Figma. It also publishes Intent, a newsletter for careerists. Free Agency is a consumer,
  waitlist-stage product and does not currently expose a public API, SDK, or developer
  platform; this profile tracks it in the API Evangelist network as a company stub.
